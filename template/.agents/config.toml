# TKSfw project configuration (.agents/config.toml) — one file, four concerns:
#   [routing.*] + [tiers] [roles] [naming]   model routing: the ONLY place where model IDs live
#   [hil]                                    Human-in-the-Loop threshold        (`ks hil show|set`)
#   [state]                                  ledger digest budgets              (STATE.md / briefings)
#   [delegation]                             parallelism and nesting limits     (route_model.py)
# Before 3.0.0 this file was `.agents/models.toml`; readers still accept that name.
#
# Routing is read at every subagent spawn by .agents/hooks/route_model.py (PreToolUse hook), and by the
# agent-mirror renderer (agentlib.py: on every validated write of .agents/agents/*.toml, and in bulk
# via `python3 .agents/hooks/sync_harness.py --models`). Edit this file
# between delegations (wait for running agents to finish); the next spawn uses the new mapping —
# no restart, no hook re-trust. Editing it is a METHOD-layer change (changes.yaml).
#
# Vocabulary:  tier    = abstract capability class used by AGENTS.md (never a model ID)
#              role    = the -<role> suffix of an agent name (AGENTS.md § Agent Naming)
#              routing = one table per provider/endpoint; `ks routing list` shows them
#
# Every tier entry carries `model` and `reasoning_effort`. Omit reasoning_effort only as a
# deliberate "provider default" decision (Codex then uses the model's default effort; Claude Code
# inherits the session effort) — and say so in a comment.
#   Codex efforts:        minimal | low | medium | high | xhigh   (xhigh not on every model)
#   Claude Code efforts:  low | medium | high | xhigh | max       (rendered into agent frontmatter)
schema = 1

# What to do when an agent name has no role mapping: "deny" (spawn blocked with a reason) or
# "inherit" (spawn allowed unchanged; the child inherits the parent's model). Deny is the method
# rule: an unnamed role is a naming violation, not a routing gap.
on_unknown_role = "deny"

# How the Codex mirror (.codex/agents/<name>.toml, generated from .agents/agents/<name>.toml) carries
# `model` / `model_reasoning_effort`:
#   "inline" (default) — rendered from the tier. Codex documents that a value set in the agent file
#                        takes precedence over the spawn value, so mirror and hook always agree.
#   "strip"            — omitted, so the hook's per-spawn value is the only source (use when agent
#                        files must stay model-free, e.g. shared across providers).
codex_agent_files = "inline"

# selected = "ibm-anthropic-cc"   # optional: pin the routing table (`ks routing use <table>`; `ks routing use --clear`
                                 # removes it). Order: TKSFW_ROUTING → selected → provider match → default_routing
default_routing = "ibm-anthropic-cc"   # table used when nothing matches (e.g. Claude Code without a base-URL match);
                                       # Claude Code is the preferred harness, so its IBM table is the default

[hil]                            # Human in the Loop threshold (AGENTS.md § Human in the Loop) — `ks hil show|set`
impact = "HIGH"                  # VERY LOW | LOW | MEDIUM | HIGH | VERY HIGH
reversibility = "HARD"           # TRIVIAL | EASY | MEDIUM | HARD | VERY HARD
logic = "or"                     # "or": either at/above its level (default); "and": both
mode = "enforce"                 # enforce: a non-compliant new decision entry is rejected; advisory: warned

[state]                          # ledger digest limits (STATE.md / SessionStart / SubagentStart briefing) — digest.py
lessons = 8                      # most recent lessons shown
decisions = 10                   # decisions in force / pending shown (each)
issues = 10                      # open ISSUE events shown
changes = 5                      # most recent changes shown
handoffs = 10                    # in-flight handoffs shown
blocked = 10                     # tasks with a negative latest gate shown
budget_chars = 3500              # digest budget inside STATE.md (the whole injection stays < 9,000 chars)
subagent_budget_chars = 4000     # briefing injected into a subagent at SubagentStart

[delegation]                     # enforced by route_model.py (PreToolUse on spawn) — AGENTS.md § Subagents
max_parallel_agents = 4          # the (N+1)th live subagent of a turn is refused; SubagentStart/Stop hooks track liveness
deny_nested_spawn = true         # a spawn issued from inside a subagent is refused (decomposition happens in main only)

[tiers]
research = "search / read-only work"
build    = "implementation and writing"
judge    = "planning, architecture, judgement, validation and review"

[roles]                          # role → tier. Full agent names may also appear here.
researcher = "research"
fetcher    = "research"
builder    = "build"
writer     = "build"
planner    = "judge"
reviewer   = "judge"
validator  = "judge"
# Built-in agent types of the harnesses (Codex / Claude Code), so they are routed too. They are
# NOT method roles: the define-agent validator refuses them as custom agent names or role suffixes.
explorer        = "research"
worker          = "build"
default         = "build"
general-purpose = "build"
Explore         = "research"
Plan            = "judge"

[naming]                         # read by the define-agent validator
builtin_agents = ["explorer", "worker", "default", "general-purpose", "Explore", "Plan"]

# ---------------------------------------------------------------------------------------------
# Routing tables — `ks routing list` shows them, `ks routing use <table>` pins one.
# Preferred harness for TKSfw: Claude Code; hence the default table below is the Claude Code one.
# Selection order at spawn time (first match wins):
#   1. $TKSFW_ROUTING=<table>                                 operator override for one shell
#   2. `selected = "<table>"` above                           `ks routing use`
#   3. Codex: the FIRST table (file order) whose `match.codex_model_provider` equals `model_provider`
#      in $CODEX_HOME/config.toml (default ~/.codex) — or whose key equals it
#   4. Claude Code: the first table whose `match.claude_base_url` is a prefix of $ANTHROPIC_BASE_URL
#   5. `default_routing` (top of file) — otherwise [routing.default] — otherwise the spawn is DENIED
# ---------------------------------------------------------------------------------------------
[routing.ibm-anthropic-cc]       # Claude Code against the IBM endpoint (provider "ibm"): 1M-context variants — the default
research = { model = "claude-haiku-4-5",    reasoning_effort = "low" }
build    = { model = "claude-sonnet-5[1m]", reasoning_effort = "medium" }
judge    = { model = "claude-opus-5[1m]",   reasoning_effort = "high" }

[routing.ibm-anthropic]          # Codex against the IBM endpoint (model_provider = "ibm"): Anthropic models.
match    = { codex_model_provider = "ibm" }   # listed before ibm-openai → wins the provider match; `ks routing use ibm-openai` to switch
research = { model = "claude-haiku-4-5", reasoning_effort = "low" }
build    = { model = "claude-sonnet-5",  reasoning_effort = "medium" }
judge    = { model = "claude-opus-5",    reasoning_effort = "high" }

[routing.ibm-openai]             # Codex against the IBM endpoint (model_provider = "ibm"): OpenAI models
match    = { codex_model_provider = "ibm" }
research = { model = "gpt-5.6-luna",  reasoning_effort = "low" }
build    = { model = "gpt-5.6-terra", reasoning_effort = "medium" }
judge    = { model = "gpt-5.6-sol",   reasoning_effort = "high" }

[routing.openrouter]             # example: one endpoint fronting several vendors
match    = { claude_base_url = "https://openrouter.ai/api" }
research = { model = "google/gemini-flash-latest",    reasoning_effort = "low" }
build    = { model = "anthropic/claude-sonnet-latest", reasoning_effort = "medium" }
judge    = { model = "anthropic/claude-opus-latest",   reasoning_effort = "high" }
